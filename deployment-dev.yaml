apiVersion: apps/v1
kind: Deployment
metadata:
  name: minterjt-lab33-dev
spec:
  replicas: 1  # Number of NGINX pods to run
  selector:
    matchLabels:
      app: minterjt-lab33-dev
  template:
    metadata:
      labels:
        app: minterjt-lab33-dev
    spec:
      containers:
      - name: nginx
        image: cithit/minterjt:latest  #<-------change this to match your MiamiID.
        ports:
        - containerPort: 80  # Expose NGINX on port 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minterjt-lab33-ingress
spec:
  rules:
  - host:
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: minterjt-lab33-dev-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: minterjt-lab33-dev-service
spec:
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: minterjt-lab33-dev
